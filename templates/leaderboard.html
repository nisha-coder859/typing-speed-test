<!DOCTYPE html>
<html>
<head>
<title>Leaderboard</title>

<style>
    body{
        background:#e8f0ff;
        font-family:Arial, sans-serif;
        text-align:center;
        padding-top:40px;
    }
    table{
        width:75%;
        margin:auto;
        border-collapse:collapse;
        background:white;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 0 15px rgba(0,0,0,0.15);
    }
    th{
        background:#005ce6;
        color:white;
        padding:15px;
        font-size:18px;
    }
    td{
        padding:12px;
        font-size:17px;
        border-bottom:1px solid #e5e5e5;
    }
    tr:nth-child(even){background:#f8faff;}
    tr:hover{background:#dff0ff;}
    .rank{
        font-weight:bold;
        color:#ff9800;
    }
    a{
        display:inline-block;
        margin-top:25px;
        text-decoration:none;
        background:#005ce6;
        padding:10px 22px;
        color:white;
        border-radius:8px;
        font-size:18px;
    }
    a:hover{background:#0042ad;}
</style>
</head>

<body>

<h1>🏆 Typing Leaderboard</h1>

<table>
<tr>
    <th>Rank</th>
    <th>Name</th>
    <th>Best WPM</th>
    <th>Average Accuracy</th>
</tr>

{% for row in data %}
<tr>
    <td class="rank">{{ loop.index }}</td>
    <td>{{ row.Name }}</td>
    <td>{{ "%.1f"|format(row.Best_WPM) }}</td>
    <td>{{ "%.1f"|format(row.Avg_Accuracy) }}%</td>
</tr>
{% endfor %}

</table>

<a href="/">⬅ Home</a>

</body>
</html>
