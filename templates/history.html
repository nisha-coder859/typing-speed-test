<!DOCTYPE html>
<html>
<head>
    <title>History</title>
    <style>
        body{
            background:#eef5ff;
            font-family:Arial, sans-serif;
            text-align:center;
            padding-top:40px;
        }
        table{
            margin:auto;
            width:80%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
            border-radius:10px;
            overflow:hidden;
        }
        th, td{
            padding:12px;
            font-size:16px;
            border-bottom:1px solid #ddd;
        }
        th{
            background:#007bff;
            color:white;
            font-size:18px;
        }
        tr:hover{
            background:#f3f9ff;
        }
        a{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
            padding:10px 25px;
            background:#007bff;
            color:white;
            font-size:18px;
            border-radius:8px;
        }
        a:hover{
            background:#005bd1;
        }
    </style>
</head>

<body>
<h1>📄 Typing History</h1>

<table>
    <tr>
        <th>Date</th>
        <th>Name</th>
        <th>WPM</th>
        <th>Accuracy</th>
    </tr>

    {% for row in data %}
    <tr>
        <td>{{ row.Date }}</td>
        <td>{{ row.Name }}</td>
        <td>{{ row.WPM }}</td>
        <td>{{ row.Accuracy }}%</td>
    </tr>
    {% endfor %}
</table>

<a href="/">⬅ Back Home</a>
</body>
</html>
