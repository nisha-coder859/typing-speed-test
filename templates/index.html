<!DOCTYPE html>
<html>
<head>
    <title>Typing Speed Test</title>
    <style>
        body{
            background:#eaf2ff;
            text-align:center;
            font-family:Arial;
            padding-top:60px;
        }
        input{
            padding:12px;
            font-size:18px;
            border-radius:6px;
            border:1px solid #555;
            width:260px;
            margin-bottom:20px;
        }
        button{
            padding:12px 28px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:6px;
            font-size:18px;
            cursor:pointer;
        }
        button:hover{background:#005bd1;}
        .links a{
            margin:20px;
            font-size:20px;
            text-decoration:none;
        }
    </style>
</head>
<body>

<h1>Typing Speed Test 📝</h1>

<form action="/test" method="POST">

    <input type="text" name="name" placeholder="Enter your name" required>

    <br>
    <!-- Difficulty Selection -->
    <label>Select Difficulty 🎯</label><br>
    <select name="difficulty" required>
        <option value="easy">Easy ✏️</option>
        <option value="medium">Medium ⚡</option>
        <option value="hard">Hard 🔥</option>
    </select>

    <br>

    <label>Set Time (seconds) ⏱</label><br>
    <input type="number" name="time" min="10" max="300" value="60" required>

    <br>

    <button type="submit">Start Normal Test 🚀</button>
</form>

<br>

<!-- Backwards Challenge -->
<form action="/daily" method="GET">
    <button style="background:#ff6600;">🔥 Daily Backwards Challenge 🔥</button>
</form>

<div class="links">
    <a href="/progress">📊 Progress</a>
    <a href="/history">📄 History</a>
    <a href="/leaderboard">🏆 Leaderboard</a>
</div>

</body>
</html>
